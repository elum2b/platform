name: Release Docker image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Format code
        run: golangci-lint fmt ./...

      - name: Check formatting
        run: git diff --exit-code

      - name: Run linter
        run: golangci-lint run ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build application
        run: go build ./...

      - name: Check git diff
        run: git diff --check

  publish:
    name: Publish Docker image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker tags
        id: tags
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          case "$tag" in
            v*) ;;
            *)
              echo "tag must start with v" >&2
              exit 1
              ;;
          esac

          tags="ghcr.io/${{ github.repository }}:$tag"
          publish_latest=false
          if [ "${{ github.event_name }}" = "release" ] &&
            [ "${{ github.event.release.prerelease }}" = "false" ]; then
            publish_latest=true
          elif [[ "$tag" != *-* ]]; then
            publish_latest=true
          fi

          if [ "$publish_latest" = "true" ]; then
            tags="$tags"$'\n'"ghcr.io/${{ github.repository }}:latest"
          fi

          {
            echo 'tags<<EOF'
            echo "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.tag || github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
